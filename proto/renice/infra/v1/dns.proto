syntax = "proto3";

package renice.infra.v1;

// DnsList 是服务端下发的解析列表命令，默认总超时 30 秒，只管 renice.cc 这一个域名。
// 全部解析命令只派给开启 DNS 的 agent，agent 也自检；角色不符 → REJECTED「本机没有开启 DNS 角色」。
// agent 使用本机 ~/.acme.sh/account.conf 的 Ali_Key / Ali_Secret，key 不离开这台机器，不在命令或输出中传输。
// API 调用失败 → FAILED 并给出脱敏后的原因；成功通过 CommandResult.dns_records 回传全部类型的记录。
message DnsList {
  // 要列出记录的域名，本版只允许 renice.cc。例："renice.cc"
  string domain = 1;
}

// DnsAddA 是新增 A 记录的命令，默认总超时 30 秒，需 DNS 角色。
// 使用本机阿里云 key（见 DnsList），key 不离开本机；保护名单由服务端判断，agent 不重复判断。
// 新增成功回传 dns_change；阿里云 API 失败 → FAILED，不支持的域名 → REJECTED。
message DnsAddA {
  // 所属域名，本版只允许 renice.cc。例："renice.cc"
  string domain = 1;
  // 主机记录。例："health"
  string rr = 2;
  // A 记录的 IPv4 地址。例："98.142.250.87"
  string value = 3;
  // 存活时间，单位秒，0 表示默认 600。例：600
  int32 ttl = 4;
}

// DnsSetA 是修改 A 记录的命令，默认总超时 30 秒，需 DNS 角色。
// 使用本机阿里云 key（见 DnsList），key 不离开本机；记录不属于 domain 或类型不是 A → REJECTED。
// 保护名单由服务端判断，agent 不重复判断；成功回传 dns_change，API 失败 → FAILED。
message DnsSetA {
  // 所属域名，本版只允许 renice.cc。例："renice.cc"
  string domain = 1;
  // 要修改的记录 ID。例："123456789012345678"
  string record_id = 2;
  // 修改后的主机记录。例："health"
  string rr = 3;
  // 修改后的 IPv4 地址。例："98.142.250.87"
  string value = 4;
  // 存活时间，单位秒，0 表示默认 600。例：600
  int32 ttl = 5;
}

// DnsDelete 是删除 A 记录的命令，默认总超时 30 秒，需 DNS 角色。
// 使用本机阿里云 key（见 DnsList），key 不离开本机；记录不属于 domain 或类型不是 A → REJECTED。
// 保护名单由服务端判断，agent 不重复判断；成功回传 dns_change，API 失败 → FAILED。
message DnsDelete {
  // 所属域名，本版只允许 renice.cc。例："renice.cc"
  string domain = 1;
  // 要删除的 A 记录 ID。例："123456789012345678"
  string record_id = 2;
}

// DnsRecords 是 DnsList 成功时随 CommandResult 返回的完整解析列表。
message DnsRecords {
  // 域名下的全部类型记录，可供服务端按类型或主机记录筛选。例：[{record_id: "123456789012345678", rr: "health", type: "A", value: "98.142.250.87", ttl: 600, line: "default", status: "ENABLE"}]
  repeated DnsRecord records = 1;
}

// DnsRecord 是阿里云上的一条解析记录；非 A 记录只读。
message DnsRecord {
  // 阿里云记录 ID。例："123456789012345678"
  string record_id = 1;
  // 主机记录。例："health"
  string rr = 2;
  // 记录类型，列表可包含全部类型，修改和删除只允许 A。例："A"、"CNAME"、"MX"、"TXT"
  string type = 3;
  // 记录值。例："98.142.250.87"
  string value = 4;
  // 存活时间，单位秒。例：600
  int32 ttl = 5;
  // 解析线路。例："default"
  string line = 6;
  // 启用状态，ENABLE 或 DISABLE。例："ENABLE"
  string status = 7;
}

// DnsChange 是新增、修改或删除成功后随 CommandResult 回传的记录标识。
message DnsChange {
  // 本次变更的记录 ID，删除时为已删除的 ID。例："123456789012345678"
  string record_id = 1;
}
