syntax = "proto3";

package renice.sso.v1;

import "google/protobuf/timestamp.proto";

// SSOService 是 renice 统一登录（renice-sso）对内提供的接口，只给各服务的后端在内网调用。
// 浏览器永远不直接调它：浏览器只和 SSO 的登录页、本服务的 REST 接口打交道。
service SSOService {
  // ExchangeCode 用登录回调里拿到的一次性 code 换出用户身份。
  //
  // 处理顺序与错误码：
  //
  // 1. client_id 不存在、客户端已停用，或者 client_secret 不对 → UNAUTHENTICATED。
  //    secret 使用常量时间比较，并在 code 之前校验：secret 错时 code 不会被消耗，拿到 code 的人没有 secret 也用不掉它。
  // 2. code 只能用一次，60 秒内有效；用过、过期，或者 client_id / redirect_uri 和发 code 时对不上 → INVALID_ARGUMENT，错误信息里写原因。
  //    走到这一步 code 就已经被消耗，哪怕后面失败也不能再用。
  // 3. 用户已在 SSO 被停用 → PERMISSION_DENIED「账号已停用」，调用方应提示用户而不是重试。
  //
  // 换到身份之后，AT/RT 仍由调用方自己签发；SSO 另外只在共享 Redis 里维护来源 SSO 会话的存活记录。
  // 调用方把返回的 sso_session_id 绑定进自己的 AT / RT 会话，之后鉴权按公开的共享 Redis 会话契约只读验活，
  // 不逐请求回调 SSO，也没有额外的验活 RPC；SSO 登出删掉记录后，用旧会话的子系统随即失效（其他设备不受影响）。
  // SSO 自己的角色（sys / ops / admin / user）不随身份返回，各服务的权限各自管理。
  //
  // 业务例子：用户在 renice-oj 点「用 renice 账号登录」，在 SSO 登录成功后被带回
  // https://oj.renice.cc/api/v1/auth/callback?code=...，renice-oj 后端拿这个 code 来换出 ice 的身份。
  rpc ExchangeCode(ExchangeCodeRequest) returns (ExchangeCodeResponse);

  // GrantApp 告诉 SSO「这个用户可以使用我」，SSO 启动台会给他显示调用方的入口。
  //
  // 授权只决定启动台显示不显示，不拦登录：用户能不能真正使用，始终由调用方自己的权限表决定。
  // 所以调用方应该在自己的权限变化时（例如某人成为 admin）调用它，并定期用 ListGrants 对账，补上写失败的那几次。
  //
  // 调用方用自己的 client_id + client_secret 证明身份，只能给自己授权，改不了别的服务：
  //
  // 1. client_id 不存在、客户端已停用，或者 client_secret 不对 → UNAUTHENTICATED（和 ExchangeCode 同一套校验）。
  // 2. user_id 不是正数 → INVALID_ARGUMENT。
  // 3. 用户不存在 → NOT_FOUND。用户已停用也可以授权（停用的人登录不了，看不到启动台）。
  // 4. 已经授权过 → 成功，created=false，granted_at 是第一次授权的时间。重复调用是安全的。
  //
  // 启动台规则：服务登记为「显示在启动台」时所有人都能看到；登记为不显示时，只有被授权的用户能看到。
  //
  // 业务例子：ice 在 renice-infra 里被设为 admin，renice-infra 后端调 GrantApp(user_id=10004)，
  // 之后 ice 打开 https://renice.cc 的启动台就能看到 renice-infra 的入口。
  rpc GrantApp(GrantAppRequest) returns (GrantAppResponse);

  // RevokeApp 撤销 GrantApp 的授权，用户的启动台不再显示调用方的入口。
  //
  // 鉴权与 GrantApp 相同，只能撤销自己的授权：
  //
  // 1. client_id 不存在、客户端已停用，或者 client_secret 不对 → UNAUTHENTICATED。
  // 2. user_id 不是正数 → INVALID_ARGUMENT。
  // 3. 本来就没有授权（包括用户不存在）→ 成功，revoked=false。重复调用是安全的。
  //
  // 业务例子：ice 在 renice-infra 里被取消 admin，renice-infra 后端调 RevokeApp(user_id=10004)。
  rpc RevokeApp(RevokeAppRequest) returns (RevokeAppResponse);

  // ListGrants 按 user_id 从小到大分页列出调用方自己的全部授权，给调用方对账用：
  // 拿它和自己的权限表比一遍，少了的补 GrantApp，多了的补 RevokeApp。
  //
  // 分页不是快照：page_token 是上一页最后一个 user_id，下一页只取比它大的。翻页期间新增、撤销的授权，
  // 可能出现也可能不出现在这次结果里。这对对账是安全的，因为调用方的授权只有调用方自己能改，
  // 翻页期间的变化都是调用方自己刚做的；对账按自己的权限表补 GrantApp / RevokeApp，两者都幂等，
  // 多补一次不会出错。漏掉的变化会在下一轮对账里对上。
  //
  // 鉴权与 GrantApp 相同，只能看到自己的授权：
  //
  // 1. client_id 不存在、客户端已停用，或者 client_secret 不对 → UNAUTHENTICATED。
  // 2. page_size 小于 0 或大于 1000、page_token 不是规范的正整数十进制串（例如 "abc"、"0"、"007"）→ INVALID_ARGUMENT。
  //    page_token 就是一个 user_id 游标，传自己编的值不会越权，只会从那个 user_id 之后开始列。
  //
  // 业务例子：renice-infra 每 10 分钟调一次，翻完所有页，和自己的 admin 列表对一遍。
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse);

  // GetUserPreferences 读取用户在 SSO 里的跨服务统一偏好设置（以 KV 形式返回已注册的所有设置项，未曾写过的键按服务端注册表的默认值补齐）。
  //
  // 鉴权与错误码：
  //
  // 1. client_id 不存在、客户端已停用，或者 client_secret 不对 → UNAUTHENTICATED。
  // 2. user_id 不是正数 → INVALID_ARGUMENT。
  // 3. 用户不存在 → NOT_FOUND。用户已停用时返回 PERMISSION_DENIED「账号已停用」，与 ExchangeCode 口径一致。
  // 4. 用户存在但从未改过任何设置 → 成功，preferences 返回全部已注册键的默认值（例如 theme_mode="light"、dark_ink="crisp"），updated_at 不填（nil）。
  //
  // 业务例子：用户在 renice-oj 把外观切成冰川夜色后打开已经登录着的 renice-infra，renice-infra 后端本地 60 秒缓存过期时调
  // GetUserPreferences(user_id=10001) 拉取最新设置。
  rpc GetUserPreferences(GetUserPreferencesRequest) returns (GetUserPreferencesResponse);

  // UpdateUserPreferences 按键局部更新用户在 SSO 里的跨服务统一偏好设置。
  //
  // 只更新 preferences 里传入的那几个键，未传入的键原样保留，不同服务并发改不同键互不覆盖；返回合并默认值后的完整设置表。
  // 虽然协议层用 map<string, string> 保证后续新增设置项免改 proto，但 SSO 服务端维护受控键注册表做白名单和枚举校验，不接受随意塞入未知键。
  //
  // 鉴权与错误码：
  //
  // 1. client_id 不存在、客户端已停用，或者 client_secret 不对 → UNAUTHENTICATED。
  // 2. user_id 不是正数、preferences 为空、包含未在 SSO 注册的键，或值不符合该键的校验规则（例如 theme_mode 传了 "blue"）→ INVALID_ARGUMENT，错误信息写明哪个键不对。
  // 3. 用户不存在 → NOT_FOUND；用户已停用 → PERMISSION_DENIED「账号已停用」。
  // 4. 重复写入相同键值或显式写入默认值时，同样会持久化对应键值行并刷新 updated_at（因此 UpdateUserPreferencesResponse.updated_at 始终非空）。
  //
  // 业务例子：用户在 renice-oj 侧栏点月亮图标切换到夜间模式，renice-oj 后端收到 PATCH 后调
  // UpdateUserPreferences(user_id=10001, preferences={"theme_mode": "dark"}) 推回 SSO。
  rpc UpdateUserPreferences(UpdateUserPreferencesRequest) returns (UpdateUserPreferencesResponse);

  // GetUserAvatar 读取用户的当前头像快照和本自然月的上传额度，给各服务后端展示头像、或者打开上传面板前调用。
  //
  // 只允许受信服务的后端调用：client_id / client_secret 必须有效，sso_session_id 必须是该用户当前存活的来源 SSO 会话，
  // 且会话记录里的 uid 与 user_id 一致。sso_session_id 只是会话关联 ID，不是 bearer 凭证，不能单独证明身份；
  // 凭据、用户 active、来源会话存在且 UID 匹配，四者都对才返回本人额度。
  //
  // 错误码：
  //
  // 1. client_id 不存在、客户端已停用、client_secret 不对，或者 sso_session_id 为空 / 不存在 / 已过期 / 会话里的 uid 与 user_id 不一致 → UNAUTHENTICATED。
  // 2. user_id 不是正数 → INVALID_ARGUMENT。
  // 3. 用户不存在 → NOT_FOUND。
  // 4. 用户已在 SSO 被停用 → PERMISSION_DENIED「账号已停用」。
  // 5. 存储暂时不可用 → UNAVAILABLE；其他服务端错误 → INTERNAL。
  //
  // 业务例子：ice 打开 renice-oj 的个人主页，renice-oj 后端带着 ice 的会话调
  // GetUserAvatar(user_id=10001, sso_session_id="3f8a1c9e2b7d4f60a1b2c3d4")，拿到头像地址和本月还剩 2 次的上传额度。
  rpc GetUserAvatar(GetUserAvatarRequest) returns (GetUserAvatarResponse);

  // UploadUserAvatar 上传并替换用户头像，客户端流式发送。
  //
  // 传输形状（不是单个 5 MiB 的 unary 消息）：
  //
  // 1. 第一条消息必须是 oneof header（UploadUserAvatarHeader），整个流里只能有一条 header；
  //    第一条不是 header、出现第二条 header、header 之后一块 chunk 都没有 → INVALID_ARGUMENT。
  // 2. header 之后的消息只能带 chunk，每块建议不超过 65536 字节（64 KiB），累计不超过 5242880 字节（5 MiB）。
  //    5 MiB 按 64 KiB 分块是 80 块，所以协议必须是流式的。
  // 3. 鉴权分两次，第一次在接收文件数据之前完成；任一项不过就立即返回并结束流，不会把 chunk 收完再拒：
  //    a. 收到第一条 header 后、读取第一块 chunk 之前，依次校验：
  //       - client_id 不存在、客户端已停用、client_secret 不对 → UNAUTHENTICATED；
  //       - user_id 不是正数、request_id 为空 → INVALID_ARGUMENT；
  //       - 用户不存在 → NOT_FOUND；用户已停用 → PERMISSION_DENIED「账号已停用」；
  //       - sso_session_id 为空、会话记录不存在 / 已过期，或记录里的 uid 与 user_id 不一致 → UNAUTHENTICATED。
  //    b. 提交前（写存储、换版本、扣额度之前）再验一次用户状态和来源会话：传输途中用户被停用、会话过期或登出，
  //       按与 a 相同的错误码拒绝，本次不产生新版本、不扣额度。
  //    这个先后顺序是可观测的契约：无效 header 必须在读到第一块 chunk 之前就失败，SSO 实现的测试可以据此断言。
  // 4. 图片格式由服务端按内容嗅探判定，只接受 JPEG / PNG / GIF / WebP（GIF、动态 WebP 允许），
  //    不信任浏览器声明的 MIME，也不看原始文件名。
  //
  // 额度与幂等（所有子服务共享同一份额度，不按 client_id 分开计数）：
  //
  // 1. 每个用户每个北京时间自然月最多成功更换 3 次头像。取消、失败、上传的图和当前头像完全相同、
  //    同一次请求的重试都不扣次数；只有真正换成了新图（changed=true）才扣一次。
  // 2. request_id 由调用方生成，幂等作用域是 (user_id, request_id)，跨 client 生效：同一用户下不同服务复用
  //    同一个 request_id 会被当成同一次上传。重试请复用原 request_id 和同一份文件。
  // 3. 同一个 request_id 重复提交相同内容 → 成功，changed=false，返回当前快照，不扣次数；
  //    同一个 request_id 提交不同内容 → ALREADY_EXISTS。
  // 4. 并发只剩 1 次额度时，最多只有一个新内容上传能成功，其余请求 RESOURCE_EXHAUSTED，不会超扣。
  //
  // 错误码：
  //
  // 1. client_id 不存在、客户端已停用、client_secret 不对，或者 sso_session_id 为空 / 不存在 / 已过期 / 会话里的 uid 与 user_id 不一致 → UNAUTHENTICATED。
  // 2. user_id 不是正数、缺少 header、header 不是第一条、重复 header、request_id 为空、累计 chunk 为 0 → INVALID_ARGUMENT。
  // 3. 用户不存在 → NOT_FOUND；用户已停用 → PERMISSION_DENIED「账号已停用」。
  // 4. 图片内容不是允许的格式、解码失败、尺寸不合法 → INVALID_ARGUMENT。
  // 5. 文件累计超过 5242880 字节 → RESOURCE_EXHAUSTED，reason="AVATAR_TOO_LARGE"；
  //    本月 3 次额度已用完 → RESOURCE_EXHAUSTED，reason="AVATAR_QUOTA_EXHAUSTED"。
  //    这两种都在 details 里带一条 google.rpc.ErrorInfo，domain 都是 "renice.sso"，metadata 的键和编码规则固定如下，
  //    SSO 与所有调用方必须按同一套实现，不能各自发挥：
  //
  //    a. metadata 里本次错误只放一个键，键名固定、大小写敏感：额度用尽 → "quota"，放当前 AvatarQuota；
  //       文件过大 → "constraints"，放当前 AvatarConstraints。不要换成 quota_json 之类的别名，也不要把两个键都塞进去，
  //       更不能把两种消息配错键。
  //    b. metadata 的值必须是对应消息的 ProtoJSON 文本，生成端固定用 google.golang.org/protobuf/encoding/protojson 的
  //       MarshalOptions{EmitUnpopulated: true}：字段名用 lowerCamelCase（resetsAt、maxBytes），
  //       google.protobuf.Timestamp 编成 RFC 3339 的 UTC 字符串（"2026-11-30T16:00:00Z"，不是 {"seconds":1796054400} 这种对象），
  //       int64 编成 JSON 字符串（maxBytes 是 "5242880"），int32 编成 JSON 数字，
  //       零值也显式输出（额度用完时 remaining 必须是 0，不能省略）。
  //    c. 消费端直接用 protojson.Unmarshal 把 metadata 的值解析回 AvatarQuota / AvatarConstraints，不要先转成 map[string]any 再手拼；
  //       不认识的 metadata 键忽略，本次错误对应的键缺失时按对应消息的默认值兜底，但不要把错误本身吞掉。
  //    d. 不要用 encoding/json 直接序列化生成的 Go 类型：它按 Go 结构体出键（resets_at）、把 Timestamp 编成 {"seconds":1796054400}，
  //       还会因为 omitempty 省略 remaining，这样的值消费端 protojson.Unmarshal 会报 unexpected token {。
  //
  //    额度用尽的完整例子（details 里只有这一条 ErrorInfo，等号右边就是 metadata 字符串的完整内容）：
  //      reason = "AVATAR_QUOTA_EXHAUSTED"
  //      domain = "renice.sso"
  //      metadata["quota"] = {"month":"2026-11","limit":3,"used":3,"remaining":0,"resetsAt":"2026-11-30T16:00:00Z"}
  //    文件过大的完整例子：
  //      reason = "AVATAR_TOO_LARGE"
  //      domain = "renice.sso"
  //      metadata["constraints"] = {"maxBytes":"5242880","formats":["jpeg","png","gif","webp"],"animationAllowed":true}
  //    上面的两段 metadata 值都能用 protojson.Unmarshal 原样解析回对应消息，生成端照着拼即可。
  // 6. 同一 (user_id, request_id) 已提交过不同内容 → ALREADY_EXISTS。
  // 7. 存储写失败 → INTERNAL；存储暂时不可用 → UNAVAILABLE。
  //
  // 业务例子：用户在 renice-infra 设置页选了一张 1.2 MB 的 WebP 动图，renice-infra 后端先发 header
  // （client_id="renice-infra"、user_id=10001、request_id="a1b2c3d4"），再按 64 KiB 发 20 块 chunk，
  // 拿到 changed=true 和新版本号 8，本月额度从 3 变成 2。
  rpc UploadUserAvatar(stream UploadUserAvatarRequest) returns (UploadUserAvatarResponse);
}

// ExchangeCodeRequest 是 ExchangeCode 的入参。
message ExchangeCodeRequest {
  // 登录回调 URL 上带回来的一次性 code。例："c_7Hq2xP9vLmN4kR8sT1wY"
  string code = 1;
  // 调用方在 SSO 登记的客户端 ID，一般就是服务名。例："renice-oj"
  string client_id = 2;
  // 客户端密钥，只放在服务器的 .env 里，绝不出现在前端和仓库里。例："（见服务器 .env 的 APP_SSO_CLIENT_SECRET）"
  string client_secret = 3;
  // 发起登录时用的回调地址，必须和那一次一字不差，防止 code 被拿到别的地址上用。例："https://oj.renice.cc/api/v1/auth/callback"
  string redirect_uri = 4;
}

// ExchangeCodeResponse 是 ExchangeCode 的出参。
message ExchangeCodeResponse {
  // 这次登录的用户。例：{id: 10001, username: "ice", display_name: "冰", email: "ice@renice.cc"}
  User user = 1;
  // 该用户的跨服务统一偏好设置（已合并服务端注册表默认值），登录换码时顺路带回，省掉一次额外 RPC。例：{"theme_mode": "dark", "dark_ink": "crisp"}
  map<string, string> preferences = 2;
  // 这次登录所依附的来源 SSO 会话 ID：调用方当作不透明字符串原样保存，不要解析，也不要自己生成。
  // 换码后调用方把它写进自己签的 AT claim 和 RT 会话；鉴权时按公开的共享 Redis 会话契约只读查一条记录验活
  // （键 `<session_key_prefix>:<sso_sid>`，默认前缀 renice-sso:session:v1，值是规范十进制正整数 uid，TTL 与来源 SSO 会话剩余寿命一致），
  // 记录缺失、uid 对不上或内容不合法都算会话失效。它只是关联 ID，不是 bearer 凭证：不能拿它调 SSO、换 token 或代表用户身份。
  // 例："3f8a1c9e2b7d4f60a1b2c3d4"
  string sso_session_id = 3;
}

// User 是 SSO 里的一个用户。各服务一律用 id 关联本地数据，不要用 username 或 email。
message User {
  // 用户在 SSO 里的唯一 ID，永不复用。例：10086
  int64 id = 1;
  // 登录名，全局唯一（不区分大小写），字母开头，含大小写字母、数字、- 和 _，按注册时原样返回。例："ice"
  string username = 2;
  // 显示名，用户随时可以改，只用来展示。例："冰"
  string display_name = 3;
  // 已验证的邮箱。例："ice@renice.cc"
  string email = 4;
  // 头像地址；没有头像时是空字符串。例："https://renice.cc/avatars/10086.png"
  string avatar_url = 5;
  // 在 SSO 注册的时间。例：2026-10-16T15:14:18+08:00
  google.protobuf.Timestamp created_at = 6;
  // 头像版本号，和 AvatarSnapshot.avatar_version 同源：换一次新头像加一，没有头像时为 0。
  // 换码顺带返回它，调用方拼头像地址时不用再调一次 GetUserAvatar。例：7
  int64 avatar_version = 7;
}

// GrantAppRequest 是 GrantApp 的入参。
message GrantAppRequest {
  // 调用方在 SSO 登记的客户端 ID，授权就记在这个服务名下。例："renice-infra"
  string client_id = 1;
  // 客户端密钥，只放在服务器的 .env 里。例："（见服务器 .env 的 APP_SSO_CLIENT_SECRET）"
  string client_secret = 2;
  // 被授权用户在 SSO 里的 ID，即 ExchangeCode 返回的 User.id。例：10004
  int64 user_id = 3;
}

// GrantAppResponse 是 GrantApp 的出参。
message GrantAppResponse {
  // 这次是否新建了授权；之前已经授权过时为 false。例：true
  bool created = 1;
  // 授权时间；之前已经授权过时是第一次授权的时间。例：2026-10-30T20:10:00+08:00
  google.protobuf.Timestamp granted_at = 2;
}

// RevokeAppRequest 是 RevokeApp 的入参。
message RevokeAppRequest {
  // 调用方在 SSO 登记的客户端 ID。例："renice-infra"
  string client_id = 1;
  // 客户端密钥，只放在服务器的 .env 里。例："（见服务器 .env 的 APP_SSO_CLIENT_SECRET）"
  string client_secret = 2;
  // 要撤销授权的用户 ID。例：10004
  int64 user_id = 3;
}

// RevokeAppResponse 是 RevokeApp 的出参。
message RevokeAppResponse {
  // 这次是否真的删掉了一条授权；本来就没有时为 false。例：true
  bool revoked = 1;
}

// ListGrantsRequest 是 ListGrants 的入参。
message ListGrantsRequest {
  // 调用方在 SSO 登记的客户端 ID，只列这个服务名下的授权。例："renice-infra"
  string client_id = 1;
  // 客户端密钥，只放在服务器的 .env 里。例："（见服务器 .env 的 APP_SSO_CLIENT_SECRET）"
  string client_secret = 2;
  // 每页最多几条，0 表示用默认值 100，最大 1000。例：100
  int32 page_size = 3;
  // 上一页返回的 next_page_token；第一页传空字符串。例：""
  string page_token = 4;
}

// ListGrantsResponse 是 ListGrants 的出参。
message ListGrantsResponse {
  // 这一页的授权，按 user_id 从小到大；没有授权时是空列表。例：[{user_id: 10004, granted_at: 2026-10-30T20:10:00+08:00}]
  repeated Grant grants = 1;
  // 下一页的 token；为空字符串表示已经是最后一页。例："10004"
  string next_page_token = 2;
}

// Grant 是一条授权：某个用户可以在启动台看到某个服务。
message Grant {
  // 被授权用户在 SSO 里的 ID。例：10004
  int64 user_id = 1;
  // 授权时间。例：2026-10-30T20:10:00+08:00
  google.protobuf.Timestamp granted_at = 2;
}

// GetUserPreferencesRequest 是 GetUserPreferences 的入参。
message GetUserPreferencesRequest {
  // 调用方在 SSO 登记的客户端 ID。例："renice-infra"
  string client_id = 1;
  // 客户端密钥，只放在服务器的 .env 里。例："（见服务器 .env 的 APP_SSO_CLIENT_SECRET）"
  string client_secret = 2;
  // 要读取偏好的用户在 SSO 里的 ID。例：10001
  int64 user_id = 3;
}

// GetUserPreferencesResponse 是 GetUserPreferences 的出参。
message GetUserPreferencesResponse {
  // 合并服务端默认值后的完整偏好设置键值表。例：{"theme_mode": "dark", "dark_ink": "crisp"}
  map<string, string> preferences = 1;
  // 该用户最近一次修改任一偏好项的时间；若用户从未修改过任何偏好则为空（不填）。例：2026-11-06T11:30:00+08:00
  google.protobuf.Timestamp updated_at = 2;
}

// UpdateUserPreferencesRequest 是 UpdateUserPreferences 的入参。
message UpdateUserPreferencesRequest {
  // 调用方在 SSO 登记的客户端 ID。例："renice-oj"
  string client_id = 1;
  // 客户端密钥，只放在服务器的 .env 里。例："（见服务器 .env 的 APP_SSO_CLIENT_SECRET）"
  string client_secret = 2;
  // 要更新偏好的用户在 SSO 里的 ID。例：10001
  int64 user_id = 3;
  // 本次要局部更新的偏好键值对（不能为空，且每个键和值都必须通过 SSO 受控注册表校验；未出现的键保持原值不变）。例：{"theme_mode": "dark"}
  map<string, string> preferences = 4;
}

// UpdateUserPreferencesResponse 是 UpdateUserPreferences 的出参。
message UpdateUserPreferencesResponse {
  // 更新完成后、合并服务端默认值的完整偏好设置键值表。例：{"theme_mode": "dark", "dark_ink": "crisp"}
  map<string, string> preferences = 1;
  // 本次更新后该用户偏好记录的最新修改时间（每次成功调用 UpdateUserPreferences 都会持久化传入键值并刷新时间，始终非空）。例：2026-11-06T11:30:00+08:00
  google.protobuf.Timestamp updated_at = 2;
}

// GetUserAvatarRequest 是 GetUserAvatar 的入参。
message GetUserAvatarRequest {
  // 调用方在 SSO 登记的客户端 ID。例："renice-oj"
  string client_id = 1;
  // 客户端密钥，只放在服务器的 .env 里。例："（见服务器 .env 的 APP_SSO_CLIENT_SECRET）"
  string client_secret = 2;
  // 要读取头像的用户在 SSO 里的 ID，必须和 sso_session_id 会话记录里的 uid 一致。例：10001
  int64 user_id = 3;
  // 这个用户的来源 SSO 会话 ID，和 ExchangeCodeResponse.sso_session_id 是同一个值。
  // 它不是 bearer 凭证，只用来确认这次读取依附的会话仍然存活且属于 user_id。例："3f8a1c9e2b7d4f60a1b2c3d4"
  string sso_session_id = 4;
}

// GetUserAvatarResponse 是 GetUserAvatar 的出参。
message GetUserAvatarResponse {
  // 用户当前的头像快照，连同本月额度和上传限制。例：{avatar_url: "https://renice.cc/api/v1/avatars/10001?v=7", avatar_version: 7, quota: {...}, constraints: {...}}
  AvatarSnapshot avatar = 1;
}

// UploadUserAvatarRequest 是 UploadUserAvatar 客户端流里的一条消息：第一条是 header，之后全是 chunk。
message UploadUserAvatarRequest {
  // 流里的负载，要么是唯一的 header，要么是一块文件字节，二者只能出现一个。
  oneof payload {
    // 上传头，必须是流的第一条消息，整个流只能有一条。例：{client_id: "renice-infra", user_id: 10001, request_id: "a1b2c3d4"}
    UploadUserAvatarHeader header = 1;
    // 文件内容的一块，建议不超过 65536 字节；累计上限 5242880 字节，5 MiB 按 64 KiB 算就是 80 块。例：b"\x89PNG\r\n\x1a\n..."
    bytes chunk = 2;
  }
}

// UploadUserAvatarHeader 是 UploadUserAvatar 流的第一条、也是唯一一条 header 消息，带着这次上传的身份和幂等键。
message UploadUserAvatarHeader {
  // 调用方在 SSO 登记的客户端 ID。例："renice-infra"
  string client_id = 1;
  // 客户端密钥，只放在服务器的 .env 里。例："（见服务器 .env 的 APP_SSO_CLIENT_SECRET）"
  string client_secret = 2;
  // 要更换头像的用户在 SSO 里的 ID。例：10001
  int64 user_id = 3;
  // 这个用户的来源 SSO 会话 ID，和 ExchangeCodeResponse.sso_session_id 是同一个值。
  // 它不是 bearer 凭证，只用来确认这次上传依附的会话仍然存活且属于 user_id。例："3f8a1c9e2b7d4f60a1b2c3d4"
  string sso_session_id = 4;
  // 调用方生成的幂等键，作用域是 (user_id, request_id) 且跨 client 生效；重试必须复用同一个值。例："a1b2c3d4-upload-20261125"
  string request_id = 5;
}

// UploadUserAvatarResponse 是 UploadUserAvatar 的出参。
message UploadUserAvatarResponse {
  // 上传完成后的头像快照，换图成功或同图重试都返回当前值。例：{avatar_url: "https://renice.cc/api/v1/avatars/10001?v=8", avatar_version: 8, quota: {...}, constraints: {...}}
  AvatarSnapshot avatar = 1;
  // 这次是否真的换成了新头像：换了为 true 并扣一次额度；上传的图和当前头像完全相同、或同一次请求的重试为 false，不扣次数。例：true
  bool changed = 2;
}

// AvatarSnapshot 是一个用户当前头像的只读快照，连同这个月的上传额度和上传限制一起返回。
message AvatarSnapshot {
  // 头像的绝对地址，格式固定为 <SSO 环境地址>/api/v1/avatars/{uid}?v={avatar_version}。
  // 这是「稳定当前头像」地址，不承诺 immutable：同一个 v 下服务端可能修复重新生成，客户端按 Cache-Control 缓存即可；
  // 换头像后 v 会变，地址随之变化，可以放心用 ?v= 破缓存。没有头像时返回统一默认图，avatar_version 为 0，地址同样稳定。
  // 例："https://renice.cc/api/v1/avatars/10001?v=7"
  string avatar_url = 1;
  // 单用户单调递增的头像版本号，换一次新图加一，和 User.avatar_version 同源；没有头像时为 0。例：7
  int64 avatar_version = 2;
  // 该用户本自然月的上传额度（所有子服务共享）。例：{month: "2026-11", limit: 3, used: 1, remaining: 2, resets_at: 2026-12-01T00:00:00+08:00}
  AvatarQuota quota = 3;
  // 上传限制，客户端可以据此在选图后先本地预检，避免白传。例：{max_bytes: 5242880, formats: ["jpeg", "png", "gif", "webp"], animation_allowed: true}
  AvatarConstraints constraints = 4;
}

// AvatarQuota 是一个用户在某个北京时间自然月里的头像更换额度。
message AvatarQuota {
  // 额度所属月份，按北京时间（Asia/Shanghai）划分，格式 YYYY-MM。例："2026-11"
  string month = 1;
  // 这个月最多能成功更换几次头像，当前固定为 3；字段保留是为了以后调整上限时不用改协议。例：3
  int32 limit = 2;
  // 这个月已经成功更换的次数，只统计 changed=true 的成功换图。例：1
  int32 used = 3;
  // 这个月还剩几次，等于 limit - used，最小为 0。例：2
  int32 remaining = 4;
  // 额度重置时间：下个月 1 日北京时间 0 点，也就是 month 的下一个自然月的起点。例：2026-12-01T00:00:00+08:00
  google.protobuf.Timestamp resets_at = 5;
}

// AvatarConstraints 是头像上传的硬限制，客户端可以据此先做本地校验。
message AvatarConstraints {
  // 单次上传允许的最大字节数：5242880（5 MiB），按流式 chunk 累计计算，不是单条消息的大小。例：5242880
  int64 max_bytes = 1;
  // 允许的图片格式，按内容嗅探判定，小写、不带点。例：["jpeg", "png", "gif", "webp"]
  repeated string formats = 2;
  // 是否允许动图（GIF、动态 WebP）。例：true
  bool animation_allowed = 3;
}
