name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUF_VERSION: "1.75.0"
  PROTOC_GEN_GO_VERSION: v1.36.12
  PROTOC_GEN_GO_GRPC_VERSION: v1.6.2

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # breaking 检查要拿到上一个提交

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true

      - name: 格式
        run: buf format --diff --exit-code

      - name: lint（含注释必填）
        run: buf lint

      - name: 破坏性改动（PR 对比目标分支）
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/${{ github.base_ref }}"

      - name: 破坏性改动（push 对比上一次 push）
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          if git cat-file -e "${{ github.event.before }}:buf.yaml" 2>/dev/null; then
            buf breaking --against ".git#ref=${{ github.event.before }}"
          else
            echo "上一次 push 里没有 buf.yaml，跳过"
          fi

      - name: 生成结果和仓库一致
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}
          rm -rf gen/go
          buf generate
          git diff --exit-code -- gen/ || { echo "gen/ 和 proto 不一致：本地跑 scripts/gen.sh 后再提交"; exit 1; }
          test -z "$(git status --porcelain -- gen/)" || { echo "gen/ 里有没提交的新文件"; git status --porcelain -- gen/; exit 1; }

      - name: 编译
        run: go build ./... && go vet ./...
